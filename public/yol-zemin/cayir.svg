<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <!-- Düz çizim (flat) oyun dünyası karosu: dikey tekrar eder. Orta şerit (x 280-520) yol için boş. -->
  <defs>
    <!-- Yuvarlak ağaç: iki ton taç + gövde + gölge -->
    <g id="agac">
      <ellipse cx="0" cy="34" rx="30" ry="9" fill="#6fae46"/>
      <rect x="-5" y="10" width="10" height="24" rx="4" fill="#8a5a33"/>
      <circle cx="0" cy="-6" r="28" fill="#4f9e3e"/>
      <circle cx="-9" cy="-14" r="18" fill="#62b84c"/>
      <circle cx="-14" cy="-20" r="6" fill="#86d06a"/>
    </g>
    <!-- Selvi -->
    <g id="selvi">
      <ellipse cx="0" cy="40" rx="16" ry="6" fill="#6fae46"/>
      <path d="M0 -44 C14 -20 16 20 0 40 C-16 20 -14 -20 0 -44Z" fill="#2f7d4a"/>
      <path d="M0 -44 C-14 -20 -16 20 0 40 C-6 10 -6 -20 0 -44Z" fill="#3f9a5c"/>
    </g>
    <!-- Çalı -->
    <g id="cali">
      <ellipse cx="0" cy="10" rx="22" ry="6" fill="#6fae46"/>
      <circle cx="-10" cy="0" r="11" fill="#5aae45"/>
      <circle cx="8" cy="-2" r="13" fill="#5aae45"/>
      <circle cx="4" cy="-6" r="6" fill="#7fca62"/>
    </g>
    <!-- Lale -->
    <g id="lale">
      <path d="M0 0 V14" stroke="#3f8f3a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-6 -6 L-6 2 Q0 7 6 2 L6 -6 L3 -2 L0 -7 L-3 -2Z" fill="#e8434b"/>
    </g>
    <g id="lale-sari">
      <path d="M0 0 V14" stroke="#3f8f3a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-6 -6 L-6 2 Q0 7 6 2 L6 -6 L3 -2 L0 -7 L-3 -2Z" fill="#ffc531"/>
    </g>
    <!-- Papatya -->
    <g id="cicek">
      <circle cx="0" cy="-4" r="3.2" fill="#fff"/><circle cx="4" cy="0" r="3.2" fill="#fff"/>
      <circle cx="0" cy="4" r="3.2" fill="#fff"/><circle cx="-4" cy="0" r="3.2" fill="#fff"/>
      <circle r="2.6" fill="#ffc531"/>
    </g>
    <!-- Taş -->
    <g id="tas">
      <ellipse cx="0" cy="6" rx="15" ry="5" fill="#6fae46"/>
      <path d="M-14 4 Q-12 -10 0 -11 Q13 -10 14 4Z" fill="#a9b3bd"/>
      <path d="M-14 4 Q-12 -10 0 -11 Q-2 -2 4 4Z" fill="#c4ccd4"/>
    </g>
    <!-- Ev: beyaz duvar, kiremit çatı -->
    <g id="ev">
      <ellipse cx="0" cy="40" rx="44" ry="9" fill="#6fae46"/>
      <rect x="-34" y="0" width="68" height="40" rx="3" fill="#fbf4e6"/>
      <rect x="-34" y="0" width="22" height="40" fill="#efe3cc"/>
      <path d="M-42 4 L0 -26 L42 4Z" fill="#d9583b"/>
      <path d="M-42 4 L0 -26 L-8 4Z" fill="#ef7352"/>
      <rect x="-24" y="12" width="12" height="12" rx="2" fill="#5ba9d6"/>
      <rect x="12" y="12" width="12" height="12" rx="2" fill="#5ba9d6"/>
      <rect x="-6" y="20" width="12" height="20" rx="5" fill="#a0673c"/>
    </g>
    <!-- Cami: kubbe + minare (flat) -->
    <g id="cami">
      <ellipse cx="6" cy="52" rx="62" ry="11" fill="#6fae46"/>
      <rect x="-40" y="10" width="80" height="42" rx="3" fill="#fbf4e6"/>
      <rect x="-40" y="10" width="26" height="42" fill="#efe3cc"/>
      <path d="M-30 12 A30 30 0 0 1 30 12Z" fill="#2fb6ab"/>
      <path d="M-30 12 A30 30 0 0 1 0 -18 Q-12 -4 -14 12Z" fill="#5fd1c6"/>
      <rect x="-1.5" y="-28" width="3" height="11" fill="#e0a43a"/>
      <circle cx="0" cy="-29" r="3" fill="#e0a43a"/>
      <rect x="-10" y="30" width="20" height="22" rx="10" fill="#a0673c"/>
      <rect x="48" y="-34" width="12" height="86" rx="2" fill="#fbf4e6"/>
      <rect x="48" y="-34" width="5" height="86" fill="#efe3cc"/>
      <rect x="45" y="-8" width="18" height="5" rx="2" fill="#e8dcc4"/>
      <path d="M47 -34 L54 -62 L61 -34Z" fill="#2fb6ab"/>
    </g>
    <!-- Çeşme -->
    <g id="cesme">
      <ellipse cx="0" cy="20" rx="36" ry="9" fill="#6fae46"/>
      <ellipse cx="0" cy="10" rx="32" ry="13" fill="#e8dcc4"/>
      <ellipse cx="0" cy="8" rx="25" ry="9" fill="#5ec8f2"/>
      <ellipse cx="-6" cy="6" rx="10" ry="3" fill="#a5e4fb"/>
      <rect x="-4" y="-14" width="8" height="20" rx="3" fill="#e8dcc4"/>
      <ellipse cx="0" cy="-14" rx="12" ry="4" fill="#e8dcc4"/>
      <path d="M0 -18 Q-10 -26 -14 -10 M0 -18 Q10 -26 14 -10" stroke="#a5e4fb" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Zemin: çayır + yumuşak tonlu çimen lekeleri -->
  <rect width="800" height="1000" fill="#9fd76f"/>
  <g fill="#93cd63">
    <ellipse cx="120" cy="140" rx="110" ry="50"/>
    <ellipse cx="680" cy="420" rx="130" ry="56"/>
    <ellipse cx="140" cy="720" rx="120" ry="52"/>
    <ellipse cx="660" cy="880" rx="110" ry="44"/>
    <ellipse cx="400" cy="560" rx="90" ry="30"/>
  </g>
  <g fill="#b2e27f">
    <ellipse cx="560" cy="160" rx="70" ry="24"/>
    <ellipse cx="240" cy="470" rx="80" ry="26"/>
    <ellipse cx="600" cy="660" rx="60" ry="20"/>
  </g>

  <!-- Sol kıyı boyunca dere (karo üst ve altta birleşir) -->
  <path d="M60 -10 C110 120 20 230 70 360 S150 560 80 700 S30 900 60 1010" stroke="#5ec8f2" stroke-width="46" fill="none" stroke-linecap="round"/>
  <path d="M60 -10 C110 120 20 230 70 360 S150 560 80 700 S30 900 60 1010" stroke="#8fdcf8" stroke-width="18" fill="none" stroke-linecap="round" stroke-dasharray="40 60"/>
  <!-- Köprü -->
  <g transform="translate(96 520) rotate(-8)">
    <rect x="-40" y="-14" width="80" height="28" rx="6" fill="#c98a52"/>
    <g stroke="#a86d3b" stroke-width="3"><path d="M-26 -14 V14 M-10 -14 V14 M6 -14 V14 M22 -14 V14"/></g>
    <rect x="-44" y="-18" width="88" height="6" rx="3" fill="#8a5a33"/>
    <rect x="-44" y="12" width="88" height="6" rx="3" fill="#8a5a33"/>
  </g>

  <!-- Sağda gölet -->
  <ellipse cx="690" cy="610" rx="80" ry="40" fill="#ffffff"/>
  <ellipse cx="690" cy="608" rx="72" ry="34" fill="#5ec8f2"/>
  <ellipse cx="668" cy="598" rx="26" ry="7" fill="#a5e4fb"/>
  <g fill="#4f9e3e"><ellipse cx="720" cy="620" rx="11" ry="5"/><ellipse cx="700" cy="630" rx="8" ry="4"/></g>

  <!-- Yapılar -->
  <use href="#cami" x="660" y="150"/>
  <use href="#ev" x="190" y="250"/>
  <use href="#ev" x="620" y="800"/>
  <use href="#ev" x="215" y="860"/>
  <use href="#cesme" x="230" y="610"/>

  <!-- Ağaçlar -->
  <use href="#agac" x="40" y="60"/>
  <use href="#agac" x="230" y="70"/>
  <use href="#selvi" x="560" y="80"/>
  <use href="#selvi" x="760" y="60"/>
  <use href="#agac" x="760" y="300"/>
  <use href="#agac" x="560" y="330"/>
  <use href="#selvi" x="250" y="400"/>
  <use href="#agac" x="160" y="420"/>
  <use href="#agac" x="770" y="520"/>
  <use href="#selvi" x="560" y="520"/>
  <use href="#agac" x="30" y="860"/>
  <use href="#agac" x="140" y="960"/>
  <use href="#agac" x="760" y="720"/>
  <use href="#selvi" x="540" y="760"/>
  <use href="#agac" x="560" y="950"/>
  <use href="#selvi" x="760" y="940"/>

  <!-- Çalılar, taşlar -->
  <use href="#cali" x="130" y="180"/>
  <use href="#cali" x="600" y="260"/>
  <use href="#cali" x="250" y="760"/>
  <use href="#cali" x="740" y="430"/>
  <use href="#tas" x="170" y="330"/>
  <use href="#tas" x="620" y="700"/>
  <use href="#tas" x="560" y="430"/>

  <!-- Çiçekler: lale tarhları ve papatyalar -->
  <g>
    <use href="#lale" x="120" y="580"/><use href="#lale-sari" x="134" y="586"/><use href="#lale" x="148" y="580"/><use href="#lale-sari" x="162" y="586"/>
    <use href="#lale" x="600" y="560"/><use href="#lale" x="614" y="566"/><use href="#lale-sari" x="628" y="560"/>
    <use href="#lale-sari" x="700" y="240"/><use href="#lale" x="714" y="246"/><use href="#lale" x="728" y="240"/>
    <use href="#lale" x="300" y="130"/><use href="#lale-sari" x="500" y="300"/><use href="#lale" x="300" y="690"/><use href="#lale-sari" x="505" y="880"/>
  </g>
  <g>
    <use href="#cicek" x="270" y="190"/><use href="#cicek" x="520" y="210"/><use href="#cicek" x="290" y="540"/>
    <use href="#cicek" x="510" y="620"/><use href="#cicek" x="680" y="350"/><use href="#cicek" x="120" y="800"/>
    <use href="#cicek" x="330" y="930"/><use href="#cicek" x="470" y="40"/><use href="#cicek" x="700" y="980"/>
  </g>
  <!-- Çimen tutamları -->
  <g fill="#7cbf52">
    <path d="M330 320 l4 -12 l4 12z M338 322 l4 -15 l4 15z"/>
    <path d="M470 470 l4 -12 l4 12z M478 472 l4 -15 l4 15z"/>
    <path d="M320 800 l4 -12 l4 12z M328 802 l4 -15 l4 15z"/>
    <path d="M480 740 l4 -12 l4 12z"/>
    <path d="M610 980 l4 -12 l4 12z M618 982 l4 -15 l4 15z"/>
    <path d="M200 520 l4 -12 l4 12z"/>
  </g>
</svg>
